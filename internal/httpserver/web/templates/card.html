<div class="hero-client-card" id="hero-client-card">
  <!-- Hidden form to supply detected IP, Hostname, and CSRF Token to HTMX actions -->
  <form id="whitelist-form" style="display: none;" onsubmit="return false;">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" id="input-ip" name="ip" value="{{.ClientIP}}">
    <input type="hidden" id="input-hostname" name="hostname" value="{{.Hostname}}">
  </form>

  <div class="client-info-row">
    <div class="client-meta">
      <span class="meta-label">Alamat IP & Provider Terdeteksi</span>
      <div class="ip-group">
        <span class="ip-address" id="client-ip-text">{{.ClientIP}}</span>
        <span class="badge-provider" id="client-provider-badge" title="Internet Service Provider (ISP)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1"/>
          </svg>
          <span id="client-provider-text">{{if .ISP}}{{.ISP}}{{else}}Deteksi Provider...{{end}}</span>
        </span>
        <button type="button" id="btn-use-public-ip" class="btn-chip" style="display: none;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Gunakan IP Publik Saya
        </button>
      </div>
    </div>

    <div class="isp-pill {{if .IsWhitelisted}}whitelisted{{else if .IsInAbuseList}}abuse{{else}}unwhitelisted{{end}}" id="client-isp-pill">
      <span class="pill-dot"></span>
      <span id="client-isp-text">
        {{if .IsWhitelisted}}AKTIF (WHITELISTED){{else if .IsInAbuseList}}TERDETEKSI ABUSE{{else}}BELUM TERDAFTAR{{end}}
      </span>
    </div>
  </div>

  <div class="hero-card-divider"></div>

  <!-- Action Switch Grid -->
  <div class="switch-grid">
    <!-- Whitelist Action Card -->
    <button type="button" class="isp-select-card oxygen-card {{if .IsWhitelisted}}active-oxygen{{end}}"
            data-action="whitelist"
            hx-post="/ui/whitelist"
            hx-include="#whitelist-form"
            hx-target="#hero-client-card"
            hx-swap="outerHTML">
      <div class="card-icon-box oxygen-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="card-text">
        <span class="card-title">{{if .IsWhitelisted}}Perpanjang Whitelist{{else}}Aktifkan Whitelist{{end}}</span>
        <span class="card-sub">
          {{if .IsWhitelisted}}
            Sisa Waktu: {{if .Timeout}}{{.Timeout}}{{else}}{{.WhitelistTTL}}{{end}}
          {{else}}
            Masa Aktif: {{.WhitelistTTL}}
          {{end}}
        </span>
      </div>
      <span class="card-action-btn">{{if .IsWhitelisted}}Perpanjang{{else}}Daftarkan IP{{end}}</span>
    </button>

    <!-- Whitelist Winbox (Port 8291) Action Card -->
    <button type="button" class="isp-select-card indihome-card {{if .IsWinboxAllowed}}active-indihome{{end}}"
            data-action="winbox"
            hx-post="/ui/winbox"
            hx-include="#whitelist-form"
            hx-target="#hero-client-card"
            hx-swap="outerHTML">
      <div class="card-icon-box indihome-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="20" height="14" x="2" y="3" rx="2"/>
          <line x1="8" x2="16" y1="21" y2="21"/>
          <line x1="12" x2="12" y1="17" y2="21"/>
        </svg>
      </div>
      <div class="card-text">
        <span class="card-title">{{if .IsWinboxAllowed}}Winbox Diizinkan{{else}}Whitelist Winbox{{end}}</span>
        <span class="card-sub">{{if .IsWinboxAllowed}}Port 8291 Aktif{{else}}Akses RouterOS Port 8291{{end}}</span>
      </div>
      <span class="card-action-btn">{{if .IsWinboxAllowed}}Cabut Winbox{{else}}Izinkan Winbox{{end}}</span>
    </button>

    <!-- Remove Whitelist Card -->
    {{if or .IsWhitelisted .IsWinboxAllowed}}
    <button type="button" class="isp-select-card"
            data-action="unwhitelist"
            hx-post="/ui/unwhitelist"
            hx-include="#whitelist-form"
            hx-target="#hero-client-card"
            hx-swap="outerHTML"
            hx-confirm="Apakah Anda yakin ingin menghapus IP {{.ClientIP}} dari whitelist MikroTik?">
      <div class="card-icon-box" style="background: #fef2f2; color: var(--danger-color);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </div>
      <div class="card-text">
        <span class="card-title">Hapus Whitelist</span>
        <span class="card-sub">Cabut akses firewall & Winbox</span>
      </div>
      <span class="card-action-btn" style="color: var(--danger-color);">Hapus Akses</span>
    </button>
    {{end}}
  </div>
</div>
