<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MikroTik IP Whitelist — PT Jagat Teknologi Indonesia</title>
  
  <!-- Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-hero-card);
      position: relative;
      z-index: 10;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand .logo-wrapper {
      display: inline-flex;
      background: #ffffff;
      padding: 6px 12px;
      border-radius: var(--radius-md);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      margin-bottom: 14px;
    }
    .login-brand h1 {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-foreground);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .login-brand .tag {
      font-size: 0.775rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }
    .security-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-dim);
      text-align: center;
    }
    .btn-sso {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      text-decoration: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="hero-bg-glow"></div>

        </div>
        <h1>PT Jagat Teknologi Indonesia</h1>
        <div class="tag">MikroTik IP Whitelist Portal</div>
      </div>

      {{if .ErrorMessage}}
        <div class="alert-banner alert-error" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div>{{.ErrorMessage}}</div>

      {{end}}

      <a href="/auth/login" class="btn btn-primary btn-sso" id="btn-sso-authentik">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/>

        Masuk dengan Authentik (SSO)

      <div class="security-notice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>

        <span>Single Sign-On via Authentik (OpenID Connect + PKCE)</span>

    </div>
  </div>

</body>
</html>
